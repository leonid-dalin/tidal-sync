name: Live tests

# The live path writes to a throwaway Tidal account using a token that is
# stored as an environment secret. workflow_dispatch is the ONLY trigger:
# there is no push, pull_request, schedule or any other event, because any
# other trigger would expose the token to forks or PR branches.
#
# The `live` environment must be created in repository settings with `main`
# as the only permitted branch and the maintainer as the required reviewer.
# Environment protection rules cannot be expressed in YAML, so this comment
# is the contract.

on:
  workflow_dispatch:
    inputs:
      account_profile:
        description: Tidal account profile written to ~/.tidal_sync
        type: string
        default: ci_throwaway
      run_writes:
        description: Run write-marked tests in addition to read-only tests
        type: boolean
        default: false
      read_against_live_data:
        description: Read against live API instead of recorded fixtures
        type: boolean
        default: true

jobs:
  live:
    runs-on: ubuntu-latest
    environment: live
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Materialise the throwaway token
        env:
          TIDAL_LIVE_TOKEN_JSON: ${{ secrets.TIDAL_LIVE_TOKEN_JSON }}
        run: |
          mkdir -p ~/.tidal_sync
          umask 077
          printf '%s' "$TIDAL_LIVE_TOKEN_JSON" > ~/.tidal_sync/${{ inputs.account_profile }}.json
          chmod 600 ~/.tidal_sync/${{ inputs.account_profile }}.json
      - name: Decide the test subset
        id: subset
        run: |
          if [ "${{ inputs.run_writes }}" = "true" ]; then
            echo "marker=live" >> "$GITHUB_OUTPUT"
          else
            echo "marker=live and not write" >> "$GITHUB_OUTPUT"
          fi
      - name: Decide the read target
        id: target
        run: |
          if [ "${{ inputs.read_against_live_data }}" = "true" ]; then
            echo "against=live" >> "$GITHUB_OUTPUT"
          else
            echo "against=fixtures" >> "$GITHUB_OUTPUT"
          fi
      - name: Run live tests
        env:
          TIDAL_TEST_PROFILE: ${{ inputs.account_profile }}
          TIDAL_TEST_AGAINST: ${{ steps.target.outputs.against }}
        run: |
          set +e
          out=$(pytest -q -m "${{ steps.subset.outputs.marker }}" 2>&1)
          rc=$?
          printf '%s\n' "$out"
          if echo "$out" | grep -Eqi 'abuse|11003'; then
            echo "::error::live account abuse lock engaged (1800s); see step output"
            exit 1
          fi
          exit $rc