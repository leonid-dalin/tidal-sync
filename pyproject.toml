[project]
name = "tidal-sync"
version = "1.1.1"
description = "A powerful, modern CLI tool to backup, restore, and clone full Tidal libraries."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
    "tidalapi>=0.8.9",
    "typer>=0.12.1",
    "pydantic>=2.12.2",
    "rich>=14.2.0",
    "requests>=2.32.0",
    "orjson>=3.11.9",
    "loguru>=0.7.3",
    "questionary>=2.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pyyaml>=6.0",
]

[project.scripts]
tidal-sync = "tidal_sync.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tidal_sync"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: exercises a real Tidal account; excluded by default",
    "write: mutates the live account; excluded unless run_writes is set",
]
addopts = "-m 'not live'"

# Non-blocking: reports type gaps without failing the build. After the
# package layout was fixed and the TidalUser protocol gained create_playlist,
# mypy reports 0 errors across the source tree.
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
enable_error_code = ["possibly-undefined", "redundant-expr"]
